name: ci

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-version:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: candidate
        name: Authorize exact version tag on current main
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${{ github.ref_type }}" == tag ]]
          version=$VERSION
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          git fetch origin main --tags --force
          sha=$(git rev-parse "refs/tags/$version^{commit}")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          tree=$(git rev-parse "refs/tags/$version^{tree}")
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$sha" ]]
          [[ "$GITHUB_SHA" == $(git rev-parse origin/main) ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

  repo-policy:
    needs: authorize-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: bash .github/scripts/verify-repo-policy.sh

  rust-and-cpp:
    needs: authorize-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install toolchain and run C++ & Rust gates
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/setup-llvm-toolchain.sh --install
          rustup toolchain install 1.96.1-x86_64-unknown-linux-gnu
          rustup default 1.96.1-x86_64-unknown-linux-gnu
          cmake -S cpp/fixed-income-kernel -B build/cpp -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp --parallel
          ctest --test-dir build/cpp --output-on-failure
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --exclude ficant-contracts --no-deps -- -D warnings
          cargo test --workspace --locked

  python-and-oracles:
    needs: authorize-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install toolchain and run Python Oracles & live SDK
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/setup-llvm-toolchain.sh --install
          rustup toolchain install 1.96.1-x86_64-unknown-linux-gnu
          rustup default 1.96.1-x86_64-unknown-linux-gnu
          curl --retry 5 --retry-all-errors -fL -o /tmp/uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.7.13/uv-x86_64-unknown-linux-gnu.tar.gz
          echo '909278eb197c5ed0e9b5f16317d1255270d1f9ea4196e7179ce934d48c4c2545  /tmp/uv.tar.gz' | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          cargo build --locked -p ficant-server
          uv run --locked --project python python -m pytest -q \
            tests/oracle/china-rates/test_phase2b_manual_oracle.py \
            tests/oracle/china-rates/test_phase2c_manual_oracle.py \
            tests/oracle/china-rates/test_phase2d_manual_oracle.py \
            tests/oracle/china-rates/test_r5d_portfolio_krd_decimal_oracle.py \
            tests/oracle/china-rates/test_r5e_tax_adjusted_decimal_oracle.py \
            python/tests
