name: release-test

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing v* version tag on the current main commit
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOY_VERSION: ${{ github.event.workflow_run.head_branch || inputs.version }}

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_VERSION }}
      - id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$DEPLOY_VERSION
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          git fetch origin main --tags --force
          sha=$(git rev-parse "refs/tags/$version^{commit}")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          tree=$(git rev-parse "refs/tags/$version^{tree}")
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$sha" == $(git rev-parse HEAD) ]]
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            [[ "$sha" == $(git rev-parse origin/main) ]]
            [[ "$version" == "${{ github.event.workflow_run.head_branch }}" ]]
            [[ "$sha" == "${{ github.event.workflow_run.head_sha }}" ]]
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Validate resolved release topology
        shell: bash
        env:
          FICANT_DEPLOY_SHA: "0000000000000000000000000000000000000000"
          FICANT_CODE_TREE_SHA: "0000000000000000000000000000000000000000"
          FICANT_IMAGE_PREFIX: ghcr.io/kayz/ficant
        run: >-
          docker compose --file deploy/test/compose.test.yml config --format json
          | python3 deploy/test/validate_release.py

  build:
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/dev/RustService.Dockerfile
          build-args: |
            BINARY=ficant-server
            FICANT_CODE_COMMIT_SHA=${{ needs.authorize.outputs.sha }}
            FICANT_CODE_TREE_SHA=${{ needs.authorize.outputs.tree }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ficant-server:sha-${{ needs.authorize.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.authorize.outputs.sha }}
            org.opencontainers.image.version=${{ needs.authorize.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=ficant-server
          cache-to: type=gha,mode=max,scope=ficant-server
          provenance: mode=max
          sbom: true

  scan:
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ficant-server:sha-${{ needs.authorize.outputs.sha }}
          format: sarif
          output: trivy-ficant-server.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          scanners: vuln
          exit-code: "1"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-ficant-server-${{ needs.authorize.outputs.sha }}
          path: trivy-ficant-server.sarif
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: [authorize, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote scanned SHA image to the immutable version tag
        shell: bash
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/ficant-server"
          docker buildx imagetools create \
            --tag "$image:$VERSION" \
            "$image:sha-$SHA"
