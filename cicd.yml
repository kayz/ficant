{
  "schema_version": 1,
  "project": {
    "name": "ficant",
    "repository": "kayz/ficant",
    "default_branch": "main"
  },
  "ci": {
    "required_workflow": "ci",
    "trigger": "version-tag",
    "version_tag_pattern": "v*",
    "cancel_outdated_runs": false
  },
  "images": [
    {
      "name": "ficant-server",
      "dockerfile": "deploy/dev/RustService.Dockerfile",
      "build_arg": "ficant-server"
    }
  ],
  "deploy": {
    "environment": "test",
    "trigger": "tag",
    "remote_root": "/srv/ficant-test",
    "compose_file": "deploy/test/compose.test.yml",
    "automatic_rollback": true,
    "concurrency_group": "ficant-test-deploy",
    "cancel_in_progress": false
  }
}
