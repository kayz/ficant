[dependencies]
async-trait = { workspace = true }
ficant-application = { path = "../../crates/ficant-application" }
ficant-bootstrap = { path = "../ficant-bootstrap" }
ficant-contracts = { path = "../../crates/ficant-contracts" }
ficant-domain = { path = "../../crates/ficant-domain" }
ficant-native-nodes = { path = "../../crates/ficant-native-nodes" }
ficant-runtime = { path = "../../crates/ficant-runtime" }
ficant-storage = { path = "../../crates/ficant-storage" }
prost = { workspace = true }
prost-types = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
chrono = { workspace = true }
ficant-api = { path = "../../crates/ficant-api" }
ficant-server = { path = "../ficant-server" }
tonic = { workspace = true }

[features]
integration-tests = []

[[test]]
name = "phase4_worker_sit"
