name: ficant-test

services:
  ficant-server:
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-server:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    init: true
    read_only: true
    user: "1654:1654"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.50
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    environment:
      FICANT_SERVER_ADDR: 0.0.0.0:8080
      FICANT_CODE_COMMIT_SHA: ${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
      FICANT_CODE_TREE_SHA: ${FICANT_CODE_TREE_SHA:?FICANT_CODE_TREE_SHA is required}
    ports:
      - 127.0.0.1:${FICANT_SERVER_PORT:-28080}:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/ficant", "--health-check"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
