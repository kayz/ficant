name: ficant-test

x-secure-service: &secure-service
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app-service: &app-service
  <<: *secure-service
  user: "1654:1654"
  restart: unless-stopped
  cpus: 0.50
  mem_limit: 256m
  environment:
    FICANT_CONFIG: /etc/ficant/ficant.toml
  volumes:
    - ${FICANT_ROOT:?FICANT_ROOT is required}/config/ficant.toml:/etc/ficant/ficant.toml:ro
  healthcheck:
    test: ["CMD", "/usr/local/bin/ficant", "--health-check"]
    interval: 5s
    timeout: 3s
    start_period: 3s
    retries: 20

services:
  postgres:
    <<: *secure-service
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 1g
    environment:
      POSTGRES_DB: ficant
      POSTGRES_USER: ficant
      POSTGRES_PASSWORD: ${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,uid=999,gid=999
    ports:
      - 127.0.0.1:${FICANT_POSTGRES_PORT:-25432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficant -d ficant"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30

  ceph-rgw:
    <<: *secure-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-ceph-rgw:sha-${FICANT_STORAGE_SHA:?FICANT_STORAGE_SHA is required}
    user: "167:167"
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 1536m
    pids_limit: 512
    environment:
      FICANT_S3_ACCESS_KEY: ${FICANT_S3_ACCESS_KEY:?FICANT_S3_ACCESS_KEY is required}
      FICANT_S3_SECRET_KEY: ${FICANT_S3_SECRET_KEY:?FICANT_S3_SECRET_KEY is required}
      FICANT_S3_BUCKET: ${FICANT_S3_BUCKET:?FICANT_S3_BUCKET is required}
    volumes:
      - ceph-data:/var/lib/ceph
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=167,gid=167
      - /run/ceph:rw,noexec,nosuid,nodev,size=16m,uid=167,gid=167
      - /var/log/ceph:rw,noexec,nosuid,nodev,size=32m,uid=167,gid=167
    ports:
      - 127.0.0.1:${FICANT_S3_PORT:-29000}:9000
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/ceph/ficant-ready && code=$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/) && test \"$${code}\" = 200"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 36

  migration:
    <<: *secure-service
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ficant
      PGUSER: ficant
      PGPASSWORD: ${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}
    volumes:
      - ${FICANT_ROOT:?FICANT_ROOT is required}/releases/${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS public.ficant_schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
        for file in /migrations/*.sql; do
          version="$$(basename "$${file}")"
          applied="$$(psql -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM public.ficant_schema_migrations WHERE version = '$${version}'")"
          if [ "$${applied}" != "1" ]; then
            { printf '%s\n' 'BEGIN;'; cat "$${file}"; printf "\nINSERT INTO public.ficant_schema_migrations(version) VALUES ('%s');\nCOMMIT;\n" "$${version}"; } | psql -v ON_ERROR_STOP=1
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy

  ficant-server:
    <<: *app-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-server:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    environment:
      FICANT_CONFIG: /etc/ficant/ficant.toml
      FICANT_GRPC_BIND: 0.0.0.0:8080
      FICANT_GRPC_WEB_ALLOWED_ORIGINS: ${FICANT_GRPC_WEB_ALLOWED_ORIGINS:?FICANT_GRPC_WEB_ALLOWED_ORIGINS is required}
      FICANT_PLATFORM_SIGNING_KEY_HEX: ${FICANT_PLATFORM_SIGNING_KEY_HEX:?FICANT_PLATFORM_SIGNING_KEY_HEX is required}
      FICANT_PLATFORM_TRACE_KEY_HEX: ${FICANT_PLATFORM_TRACE_KEY_HEX:?FICANT_PLATFORM_TRACE_KEY_HEX is required}
      FICANT_BOOTSTRAP_SUBJECT: ficant-test-user
      FICANT_BOOTSTRAP_BEARER_TOKEN: ${FICANT_BOOTSTRAP_BEARER_TOKEN:?FICANT_BOOTSTRAP_BEARER_TOKEN is required}
      FICANT_BOOTSTRAP_SCOPES: apps:read,experiment:read,experiment:write
      FICANT_EXPERIMENT_DATABASE_URL: postgres://ficant:${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}@postgres:5432/ficant
      FICANT_EXPERIMENT_S3_ENDPOINT: http://ceph-rgw:9000
      FICANT_EXPERIMENT_S3_BUCKET: ${FICANT_S3_BUCKET:?FICANT_S3_BUCKET is required}
      FICANT_EXPERIMENT_S3_ACCESS_KEY: ${FICANT_S3_ACCESS_KEY:?FICANT_S3_ACCESS_KEY is required}
      FICANT_EXPERIMENT_S3_SECRET_KEY: ${FICANT_S3_SECRET_KEY:?FICANT_S3_SECRET_KEY is required}
      FICANT_EXPERIMENT_CURSOR_KEY_HEX: ${FICANT_EXPERIMENT_CURSOR_KEY_HEX:?FICANT_EXPERIMENT_CURSOR_KEY_HEX is required}
      FICANT_EXPERIMENT_TENANT_ID: "01J00000000000000000000010"
      FICANT_EXPERIMENT_OWNER_ID: "01J00000000000000000000011"
      FICANT_EXPERIMENT_ACTOR_ID: "01J00000000000000000000012"
      FICANT_EXPERIMENT_RUNTIME_IMAGE_DIGEST: ${FICANT_WORKER_RUNTIME_IMAGE_DIGEST:?FICANT_WORKER_RUNTIME_IMAGE_DIGEST is required}
      FICANT_EXPERIMENT_ENVIRONMENT_ATTESTATION: |-
        ficant.worker.environment.v1
        arch=amd64
        os=linux
        profile=test
      FICANT_EXPERIMENT_NATIVE_SOURCE_DIGEST: ${FICANT_WORKER_NATIVE_SOURCE_DIGEST:?FICANT_WORKER_NATIVE_SOURCE_DIGEST is required}
    ports:
      - 127.0.0.1:${FICANT_SERVER_PORT:-28080}:8080
    depends_on:
      migration:
        condition: service_completed_successfully
      ceph-rgw:
        condition: service_healthy

  ficant-worker:
    <<: *app-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-worker:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    environment:
      FICANT_CONFIG: /etc/ficant/ficant.toml
      FICANT_WORKER_DATABASE_URL: postgres://ficant:${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}@postgres:5432/ficant
      FICANT_WORKER_S3_ENDPOINT: http://ceph-rgw:9000
      FICANT_WORKER_S3_BUCKET: ${FICANT_S3_BUCKET:?FICANT_S3_BUCKET is required}
      FICANT_WORKER_S3_ACCESS_KEY: ${FICANT_S3_ACCESS_KEY:?FICANT_S3_ACCESS_KEY is required}
      FICANT_WORKER_S3_SECRET_KEY: ${FICANT_S3_SECRET_KEY:?FICANT_S3_SECRET_KEY is required}
      FICANT_WORKER_ID: "01J00000000000000000000001"
      FICANT_WORKER_LEASE_SECONDS: "60"
      FICANT_WORKER_RENEW_SECONDS: "20"
      FICANT_WORKER_IDLE_POLL_MS: "500"
      FICANT_WORKER_NODE_TIMEOUT_SECONDS: "30"
      FICANT_WORKER_RUNTIME_IMAGE_DIGEST: ${FICANT_WORKER_RUNTIME_IMAGE_DIGEST:?FICANT_WORKER_RUNTIME_IMAGE_DIGEST is required}
      FICANT_WORKER_ENVIRONMENT_ATTESTATION: |-
        ficant.worker.environment.v1
        arch=amd64
        os=linux
        profile=test
      FICANT_WORKER_NATIVE_SOURCE_DIGEST: ${FICANT_WORKER_NATIVE_SOURCE_DIGEST:?FICANT_WORKER_NATIVE_SOURCE_DIGEST is required}
    ports:
      - 127.0.0.1:${FICANT_WORKER_PORT:-28081}:8080
    depends_on:
      migration:
        condition: service_completed_successfully
      ceph-rgw:
        condition: service_healthy
      ficant-server:
        condition: service_healthy

  ficant-web:
    <<: *app-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-web:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    ports:
      - 127.0.0.1:${FICANT_WEB_PORT:-28082}:8080
    depends_on:
      migration:
        condition: service_completed_successfully
      ficant-server:
        condition: service_healthy

  ficant-ui:
    <<: *secure-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-ui:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    user: "101:101"
    restart: unless-stopped
    environment:
      FICANT_UI_BEARER_TOKEN: ${FICANT_BOOTSTRAP_BEARER_TOKEN:?FICANT_BOOTSTRAP_BEARER_TOKEN is required}
    cpus: 0.50
    mem_limit: 256m
    ports:
      - 127.0.0.1:${FICANT_UI_PORT:-28083}:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 20
    depends_on:
      ficant-server:
        condition: service_healthy

volumes:
  postgres-data:
  ceph-data:
