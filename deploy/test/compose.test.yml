name: ficant-test

x-secure-service: &secure-service
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app-service: &app-service
  <<: *secure-service
  user: "1654:1654"
  restart: unless-stopped
  cpus: 0.50
  mem_limit: 256m
  environment:
    FICANT_CONFIG: /etc/ficant/ficant.toml
  volumes:
    - ${FICANT_ROOT:?FICANT_ROOT is required}/config/ficant.toml:/etc/ficant/ficant.toml:ro
  healthcheck:
    test: ["CMD", "/usr/local/bin/ficant", "--health-check"]
    interval: 5s
    timeout: 3s
    start_period: 3s
    retries: 20

services:
  postgres:
    <<: *secure-service
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: unless-stopped
    cpus: 1.00
    mem_limit: 1g
    environment:
      POSTGRES_DB: ficant
      POSTGRES_USER: ficant
      POSTGRES_PASSWORD: ${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,uid=999,gid=999
    ports:
      - 127.0.0.1:${FICANT_POSTGRES_PORT:-25432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficant -d ficant"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30

  migration:
    <<: *secure-service
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ficant
      PGUSER: ficant
      PGPASSWORD: ${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}
    volumes:
      - ${FICANT_ROOT:?FICANT_ROOT is required}/releases/${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS public.ficant_schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
        for file in /migrations/*.sql; do
          version="$$(basename "$${file}")"
          applied="$$(psql -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM public.ficant_schema_migrations WHERE version = '$${version}'")"
          if [ "$${applied}" != "1" ]; then
            { printf '%s\n' 'BEGIN;'; cat "$${file}"; printf "\nINSERT INTO public.ficant_schema_migrations(version) VALUES ('%s');\nCOMMIT;\n" "$${version}"; } | psql -v ON_ERROR_STOP=1
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy

  ficant-server:
    <<: *app-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-server:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    environment:
      FICANT_CONFIG: /etc/ficant/ficant.toml
      FICANT_GRPC_BIND: 0.0.0.0:8080
      FICANT_GRPC_WEB_ALLOWED_ORIGINS: ${FICANT_GRPC_WEB_ALLOWED_ORIGINS:?FICANT_GRPC_WEB_ALLOWED_ORIGINS is required}
      FICANT_PLATFORM_SIGNING_KEY_HEX: ${FICANT_PLATFORM_SIGNING_KEY_HEX:?FICANT_PLATFORM_SIGNING_KEY_HEX is required}
      FICANT_PLATFORM_TRACE_KEY_HEX: ${FICANT_PLATFORM_TRACE_KEY_HEX:?FICANT_PLATFORM_TRACE_KEY_HEX is required}
    ports:
      - 127.0.0.1:${FICANT_SERVER_PORT:-28080}:8080
    depends_on:
      migration:
        condition: service_completed_successfully

  ficant-worker:
    <<: *app-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-worker:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    ports:
      - 127.0.0.1:${FICANT_WORKER_PORT:-28081}:8080
    depends_on:
      migration:
        condition: service_completed_successfully
      ficant-server:
        condition: service_healthy

  ficant-web:
    <<: *app-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-web:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    ports:
      - 127.0.0.1:${FICANT_WEB_PORT:-28082}:8080
    depends_on:
      migration:
        condition: service_completed_successfully
      ficant-server:
        condition: service_healthy

  ficant-ui:
    <<: *secure-service
    image: ${FICANT_IMAGE_PREFIX:?FICANT_IMAGE_PREFIX is required}-ui:sha-${FICANT_DEPLOY_SHA:?FICANT_DEPLOY_SHA is required}
    user: "101:101"
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 256m
    ports:
      - 127.0.0.1:${FICANT_UI_PORT:-28083}:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 20
    depends_on:
      ficant-server:
        condition: service_healthy

volumes:
  postgres-data:
