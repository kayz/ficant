name: ficant-iteration-2

x-secure-service: &secure-service
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  cpus: 0.50
  mem_limit: 256m
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m

x-rust-service: &rust-service
  <<: *secure-service
  profiles: [dev]
  restart: unless-stopped
  user: "1654:1654"
  environment:
    FICANT_CONFIG: /etc/ficant/ficant.toml
  volumes:
    - ./config/ficant.toml:/etc/ficant/ficant.toml:ro
  healthcheck:
    test: ["CMD", "/usr/local/bin/ficant", "--health-check"]
    interval: 5s
    timeout: 3s
    start_period: 2s
    retries: 12

services:
  postgres:
    <<: *secure-service
    profiles: [dev]
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ficant
      POSTGRES_USER: ficant
      POSTGRES_PASSWORD: "${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,uid=999,gid=999
    ports:
      - "127.0.0.1:${FICANT_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficant -d ficant"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20

  minio:
    <<: *secure-service
    profiles: [dev]
    image: ficant/minio-runtime:iteration-2
    build:
      context: ../..
      dockerfile: deploy/dev/Minio.Dockerfile
      args:
        MINIO_IMAGE: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    user: "1000:1000"
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${FICANT_MINIO_ROOT_USER:?FICANT_MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${FICANT_MINIO_ROOT_PASSWORD:?FICANT_MINIO_ROOT_PASSWORD is required}"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${FICANT_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20

  minio-init:
    <<: *secure-service
    profiles: [dev]
    image: minio/mc@sha256:09f93f534cde415d192bb6084dd0e0ddd1715fb602f8a922ad121fd2bf0f8b44
    user: "1000:1000"
    restart: "no"
    environment:
      MINIO_ROOT_USER: "${FICANT_MINIO_ROOT_USER:?FICANT_MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${FICANT_MINIO_ROOT_PASSWORD:?FICANT_MINIO_ROOT_PASSWORD is required}"
      FICANT_MINIO_BUCKET: "${FICANT_MINIO_BUCKET:-ficant}"
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${FICANT_MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy

  migration:
    <<: *secure-service
    profiles: [dev]
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ficant
      PGUSER: ficant
      PGPASSWORD: "${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}"
    volumes:
      - ../../migrations/postgresql:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS public.ficant_schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
        for file in /migrations/*.sql; do
          version="$$(basename "$${file}")"
          applied="$$(psql -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM public.ficant_schema_migrations WHERE version = '$${version}'")"
          if [ "$${applied}" != "1" ]; then
            { printf '%s\n' 'BEGIN;'; cat "$${file}"; printf "\nINSERT INTO public.ficant_schema_migrations(version) VALUES ('%s');\nCOMMIT;\n" "$${version}"; } | psql -v ON_ERROR_STOP=1
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy

  ficant-server:
    <<: *rust-service
    build:
      context: ../..
      dockerfile: deploy/dev/RustService.Dockerfile
      args:
        BINARY: ficant-server
    environment:
      FICANT_CONFIG: /etc/ficant/ficant.toml
      FICANT_GRPC_BIND: "0.0.0.0:8080"
      FICANT_GRPC_WEB_ALLOWED_ORIGINS: "http://127.0.0.1:${FICANT_WEB_PORT:-18082}"
      FICANT_PLATFORM_SIGNING_KEY_HEX: "${FICANT_PLATFORM_SIGNING_KEY_HEX:?FICANT_PLATFORM_SIGNING_KEY_HEX is required}"
      FICANT_PLATFORM_TRACE_KEY_HEX: "${FICANT_PLATFORM_TRACE_KEY_HEX:?FICANT_PLATFORM_TRACE_KEY_HEX is required}"
      FICANT_BOOTSTRAP_SUBJECT:
      FICANT_BOOTSTRAP_BEARER_TOKEN:
      FICANT_BOOTSTRAP_SCOPES:
    ports:
      - "127.0.0.1:${FICANT_SERVER_PORT:-18080}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  ficant-worker:
    <<: *rust-service
    build:
      context: ../..
      dockerfile: deploy/dev/RustService.Dockerfile
      args:
        BINARY: ficant-worker
    ports:
      - "127.0.0.1:${FICANT_WORKER_PORT:-18081}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ficant-server:
        condition: service_healthy

  ficant-web:
    <<: *rust-service
    build:
      context: ../..
      dockerfile: deploy/dev/RustService.Dockerfile
      args:
        BINARY: ficant-web
    ports:
      - "127.0.0.1:${FICANT_WEB_PORT:-18082}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ficant-server:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
