name: ficant-dev

x-secure-service: &secure-service
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  cpus: 0.50
  mem_limit: 256m
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m

x-rust-service: &rust-service
  <<: *secure-service
  profiles: [dev]
  restart: unless-stopped
  user: "1654:1654"
  environment:
    FICANT_CONFIG: /etc/ficant/ficant.toml
  volumes:
    - ./config/ficant.toml:/etc/ficant/ficant.toml:ro
  healthcheck:
    test: ["CMD", "/usr/local/bin/ficant", "--health-check"]
    interval: 5s
    timeout: 3s
    start_period: 2s
    retries: 12

services:
  postgres:
    <<: *secure-service
    profiles: [dev]
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ficant
      POSTGRES_USER: ficant
      POSTGRES_PASSWORD: "${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,uid=999,gid=999
    ports:
      - "127.0.0.1:${FICANT_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficant -d ficant"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20

  ceph-rgw:
    <<: *secure-service
    profiles: [dev]
    image: ficant/ceph-rgw-runtime:dev
    build:
      context: ../..
      dockerfile: deploy/dev/Ceph.Dockerfile
      args:
        CEPH_IMAGE: quay.io/ceph/ceph@sha256:6b4b5ae33acd3d736eb26d2a19238bce71a22f9cfb99cca887ba6312d0957644
    user: "167:167"
    restart: unless-stopped
    environment:
      FICANT_S3_ACCESS_KEY: "${FICANT_S3_ACCESS_KEY:?FICANT_S3_ACCESS_KEY is required}"
      FICANT_S3_SECRET_KEY: "${FICANT_S3_SECRET_KEY:?FICANT_S3_SECRET_KEY is required}"
      FICANT_S3_BUCKET: "${FICANT_S3_BUCKET:-ficant}"
    volumes:
      - ceph-data:/var/lib/ceph
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=167,gid=167
      - /run/ceph:rw,noexec,nosuid,nodev,size=16m,uid=167,gid=167
      - /var/log/ceph:rw,noexec,nosuid,nodev,size=32m,uid=167,gid=167
    cpus: 1.00
    mem_limit: 1536m
    pids_limit: 512
    ports:
      - "127.0.0.1:${FICANT_S3_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/ceph/ficant-ready && code=$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/) && test \"$${code}\" = 200"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 36

  migration:
    <<: *secure-service
    profiles: [dev]
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    user: "999:999"
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ficant
      PGUSER: ficant
      PGPASSWORD: "${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}"
    volumes:
      - ../../migrations/postgresql:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS public.ficant_schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())'
        for file in /migrations/*.sql; do
          version="$$(basename "$${file}")"
          applied="$$(psql -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM public.ficant_schema_migrations WHERE version = '$${version}'")"
          if [ "$${applied}" != "1" ]; then
            { printf '%s\n' 'BEGIN;'; cat "$${file}"; printf "\nINSERT INTO public.ficant_schema_migrations(version) VALUES ('%s');\nCOMMIT;\n" "$${version}"; } | psql -v ON_ERROR_STOP=1
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy

  ficant-server:
    <<: *rust-service
    image: ficant/server:dev
    build:
      context: ../..
      dockerfile: deploy/dev/RustService.Dockerfile
      args:
        BINARY: ficant-server
        FICANT_CODE_COMMIT_SHA: "${FICANT_CODE_COMMIT_SHA:?FICANT_CODE_COMMIT_SHA is derived by scripts/dev-up.ps1}"
        FICANT_CODE_TREE_SHA: "${FICANT_CODE_TREE_SHA:?FICANT_CODE_TREE_SHA is derived by scripts/dev-up.ps1}"
    environment:
      FICANT_CONFIG: /etc/ficant/ficant.toml
      FICANT_GRPC_BIND: "0.0.0.0:8080"
      FICANT_GRPC_WEB_ALLOWED_ORIGINS: "http://127.0.0.1:${FICANT_UI_PORT:-18083}"
      FICANT_CODE_COMMIT_SHA: "${FICANT_CODE_COMMIT_SHA:?FICANT_CODE_COMMIT_SHA is derived by scripts/dev-up.ps1}"
      FICANT_CODE_TREE_SHA: "${FICANT_CODE_TREE_SHA:?FICANT_CODE_TREE_SHA is derived by scripts/dev-up.ps1}"
      FICANT_SERVER_RUNTIME_IMAGE_DIGEST: "${FICANT_SERVER_RUNTIME_IMAGE_DIGEST:?FICANT_SERVER_RUNTIME_IMAGE_DIGEST is derived by scripts/dev-up.ps1}"
      FICANT_SERVER_ENVIRONMENT_ATTESTATION: "${FICANT_SERVER_ENVIRONMENT_ATTESTATION:?FICANT_SERVER_ENVIRONMENT_ATTESTATION is derived by scripts/dev-up.ps1}"
      FICANT_PLATFORM_SIGNING_KEY_HEX: "${FICANT_PLATFORM_SIGNING_KEY_HEX:?FICANT_PLATFORM_SIGNING_KEY_HEX is required}"
      FICANT_PLATFORM_TRACE_KEY_HEX: "${FICANT_PLATFORM_TRACE_KEY_HEX:?FICANT_PLATFORM_TRACE_KEY_HEX is required}"
      FICANT_BOOTSTRAP_SUBJECT: "${FICANT_BOOTSTRAP_SUBJECT:?FICANT_BOOTSTRAP_SUBJECT is required}"
      FICANT_BOOTSTRAP_BEARER_TOKEN: "${FICANT_BOOTSTRAP_BEARER_TOKEN:?FICANT_BOOTSTRAP_BEARER_TOKEN is required}"
      FICANT_BOOTSTRAP_SCOPES: "${FICANT_BOOTSTRAP_SCOPES:?FICANT_BOOTSTRAP_SCOPES is required}"
      FICANT_EXPERIMENT_DATABASE_URL: "postgres://ficant:${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}@postgres:5432/ficant"
      FICANT_EXPERIMENT_S3_ENDPOINT: "http://ceph-rgw:9000"
      FICANT_EXPERIMENT_S3_BUCKET: "${FICANT_S3_BUCKET:-ficant}"
      FICANT_EXPERIMENT_S3_ACCESS_KEY: "${FICANT_S3_ACCESS_KEY:?FICANT_S3_ACCESS_KEY is required}"
      FICANT_EXPERIMENT_S3_SECRET_KEY: "${FICANT_S3_SECRET_KEY:?FICANT_S3_SECRET_KEY is required}"
      FICANT_EXPERIMENT_CURSOR_KEY_HEX: "${FICANT_EXPERIMENT_CURSOR_KEY_HEX:?FICANT_EXPERIMENT_CURSOR_KEY_HEX is required}"
      FICANT_EXPERIMENT_TENANT_ID: "01J00000000000000000000010"
      FICANT_EXPERIMENT_OWNER_ID: "01J00000000000000000000011"
      FICANT_EXPERIMENT_ACTOR_ID: "01J00000000000000000000012"
      FICANT_EXPERIMENT_RUNTIME_IMAGE_DIGEST: "${FICANT_WORKER_RUNTIME_IMAGE_DIGEST:?FICANT_WORKER_RUNTIME_IMAGE_DIGEST is derived by scripts/dev-up.ps1}"
      FICANT_EXPERIMENT_ENVIRONMENT_ATTESTATION: |-
        ficant.worker.environment.v1
        arch=amd64
        os=linux
        profile=development
      FICANT_EXPERIMENT_NATIVE_SOURCE_DIGEST: "${FICANT_WORKER_NATIVE_SOURCE_DIGEST:?FICANT_WORKER_NATIVE_SOURCE_DIGEST is derived by scripts/dev-up.ps1}"
    ports:
      - "127.0.0.1:${FICANT_SERVER_PORT:-18080}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      ceph-rgw:
        condition: service_healthy

  ficant-worker:
    <<: *rust-service
    image: ficant/worker:dev
    build:
      context: ../..
      dockerfile: deploy/dev/RustService.Dockerfile
      args:
        BINARY: ficant-worker
        FICANT_CODE_COMMIT_SHA: "${FICANT_CODE_COMMIT_SHA:?FICANT_CODE_COMMIT_SHA is derived by scripts/dev-up.ps1}"
        FICANT_CODE_TREE_SHA: "${FICANT_CODE_TREE_SHA:?FICANT_CODE_TREE_SHA is derived by scripts/dev-up.ps1}"
    environment:
      FICANT_CONFIG: /etc/ficant/ficant.toml
      FICANT_CODE_COMMIT_SHA: "${FICANT_CODE_COMMIT_SHA:?FICANT_CODE_COMMIT_SHA is derived by scripts/dev-up.ps1}"
      FICANT_CODE_TREE_SHA: "${FICANT_CODE_TREE_SHA:?FICANT_CODE_TREE_SHA is derived by scripts/dev-up.ps1}"
      FICANT_WORKER_DATABASE_URL: "postgres://ficant:${FICANT_POSTGRES_PASSWORD:?FICANT_POSTGRES_PASSWORD is required}@postgres:5432/ficant"
      FICANT_WORKER_S3_ENDPOINT: "http://ceph-rgw:9000"
      FICANT_WORKER_S3_BUCKET: "${FICANT_S3_BUCKET:-ficant}"
      FICANT_WORKER_S3_ACCESS_KEY: "${FICANT_S3_ACCESS_KEY:?FICANT_S3_ACCESS_KEY is required}"
      FICANT_WORKER_S3_SECRET_KEY: "${FICANT_S3_SECRET_KEY:?FICANT_S3_SECRET_KEY is required}"
      FICANT_WORKER_ID: "01J00000000000000000000001"
      FICANT_WORKER_LEASE_SECONDS: "60"
      FICANT_WORKER_RENEW_SECONDS: "20"
      FICANT_WORKER_IDLE_POLL_MS: "500"
      FICANT_WORKER_NODE_TIMEOUT_SECONDS: "30"
      FICANT_WORKER_ORPHAN_GRACE_SECONDS: "3600"
      FICANT_WORKER_ORPHAN_INTERVAL_SECONDS: "300"
      FICANT_WORKER_RUNTIME_IMAGE_DIGEST: "${FICANT_WORKER_RUNTIME_IMAGE_DIGEST:?FICANT_WORKER_RUNTIME_IMAGE_DIGEST is derived by scripts/dev-up.ps1}"
      FICANT_WORKER_ENVIRONMENT_ATTESTATION: |-
        ficant.worker.environment.v1
        arch=amd64
        os=linux
        profile=development
      FICANT_WORKER_NATIVE_SOURCE_DIGEST: "${FICANT_WORKER_NATIVE_SOURCE_DIGEST:?FICANT_WORKER_NATIVE_SOURCE_DIGEST is derived by scripts/dev-up.ps1}"
    ports:
      - "127.0.0.1:${FICANT_WORKER_PORT:-18081}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
      ceph-rgw:
        condition: service_healthy
      ficant-server:
        condition: service_healthy

  ficant-ui:
    <<: *secure-service
    profiles: [ui]
    build:
      context: ../..
      dockerfile: deploy/test/FicantUi.Dockerfile
    user: "101:101"
    restart: unless-stopped
    environment:
      FICANT_UI_BEARER_TOKEN: "${FICANT_BOOTSTRAP_BEARER_TOKEN:?FICANT_BOOTSTRAP_BEARER_TOKEN is required}"
    ports:
      - "127.0.0.1:${FICANT_UI_PORT:-18083}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 20
    depends_on:
      ficant-server:
        condition: service_healthy

volumes:
  postgres-data:
  ceph-data:
