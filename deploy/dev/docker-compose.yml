name: ficant-dev

services:
  ficant-server:
    image: ficant/server:dev
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1654:1654"
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/dev/RustService.Dockerfile
      args:
        BINARY: ficant-server
        FICANT_CODE_COMMIT_SHA: "${FICANT_CODE_COMMIT_SHA:-0000000000000000000000000000000000000000}"
        FICANT_CODE_TREE_SHA: "${FICANT_CODE_TREE_SHA:-0000000000000000000000000000000000000000}"
    environment:
      FICANT_SERVER_ADDR: "0.0.0.0:8080"
    ports:
      - "127.0.0.1:${FICANT_SERVER_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ficant", "--health-check"]
      interval: 5s
      timeout: 3s
      start_period: 2s
      retries: 12
