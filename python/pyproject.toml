[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ficant-sdk"
version = "0.1.0"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "grpcio==1.73.1",
    "protobuf==6.33.5",
]

[project.urls]
Repository = "https://github.com/kayz/ficant"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pytest==9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = [
    "sdk/src/ficant_sdk",
    "node-contracts/src/ficant_contracts/generated/ficant",
]
