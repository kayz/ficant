services:
  postgres:
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    init: true
    read_only: true
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ficant
      POSTGRES_USER: ficant
      POSTGRES_PASSWORD: "${FICANT_RECOVERY_POSTGRES_PASSWORD:?required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: "${FICANT_RECOVERY_ARTIFACT_ROOT:?required}"
        target: /backup
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,uid=999,gid=999
    ports:
      - "127.0.0.1:${FICANT_RECOVERY_POSTGRES_PORT:?required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficant -d ficant"]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 30

  ceph-rgw:
    image: ficant/ceph-rgw-runtime:dev
    build:
      context: ../..
      dockerfile: deploy/dev/Ceph.Dockerfile
      args:
        CEPH_IMAGE: quay.io/ceph/ceph@sha256:6b4b5ae33acd3d736eb26d2a19238bce71a22f9cfb99cca887ba6312d0957644
    init: true
    read_only: true
    user: "167:167"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.00
    mem_limit: 1536m
    pids_limit: 512
    environment:
      FICANT_S3_ACCESS_KEY: "${FICANT_RECOVERY_S3_ACCESS_KEY:?required}"
      FICANT_S3_SECRET_KEY: "${FICANT_RECOVERY_S3_SECRET_KEY:?required}"
      FICANT_S3_BUCKET: "${FICANT_RECOVERY_S3_BUCKET:?required}"
    volumes:
      - ceph-data:/var/lib/ceph
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=167,gid=167
      - /run/ceph:rw,noexec,nosuid,nodev,size=16m,uid=167,gid=167
      - /var/log/ceph:rw,noexec,nosuid,nodev,size=32m,uid=167,gid=167
    ports:
      - "127.0.0.1:${FICANT_RECOVERY_S3_PORT:?required}:9000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/ceph/ficant-ready && code=$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/) && test \"$${code}\" = 200"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 36

volumes:
  postgres-data:
  ceph-data:
