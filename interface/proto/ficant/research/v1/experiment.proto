syntax = "proto3";

package ficant.research.v1;

import "ficant/core/v1/common.proto";
import "ficant/core/v1/evidence.proto";
import "ficant/research/v1/execution.proto";
import "ficant/research/v1/graph.proto";
import "ficant/research/v1/journal.proto";

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_CREATED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_SUCCEEDED = 3;
  RUN_STATE_FAILED = 4;
  RUN_STATE_CANCELLED = 5;
}

message ExperimentRun {
  ficant.core.v1.Ulid experiment_run_id = 1;
  ficant.core.v1.OwnerRef owner = 2;
  ficant.core.v1.LineageRef data_snapshot = 3;
  ficant.core.v1.LineageRef universe_snapshot = 4;
  repeated ficant.core.v1.VersionRef rule_packs = 5;
  ficant.core.v1.Sha256 runtime_image_digest = 6;
  ficant.core.v1.Sha256 parameters_hash = 7;
  uint64 seed = 8;
  RunState state = 9;
  uint64 revision = 10;
}

message CreateRunRequest {
  string idempotency_key = 1;
  ExperimentRun run = 2;
}

message CreateRunResponse {
  ExperimentRun run = 1;
}

message TransitionRunRequest {
  ficant.core.v1.Ulid run_id = 1;
  uint64 expected_revision = 2;
  RunState next_state = 3;
}

message TransitionRunResponse {
  ExperimentRun run = 1;
}

message GetRunRequest {
  ficant.core.v1.Ulid run_id = 1;
}

message GetRunResponse {
  ExperimentRun run = 1;
}

message ReadRunJournalRequest {
  ficant.core.v1.Ulid run_id = 1;
  uint64 from_sequence = 2;
  ficant.core.v1.PageRequest page = 3;
}

message ReadRunJournalResponse {
  repeated RunJournal events = 1;
  ficant.core.v1.PageResponse page = 2;
}

// Submits one fully frozen graph run. Tenant, owner and deployment attestation are
// derived from the authenticated server boundary and therefore are deliberately
// absent from this request.
message SubmitGraphRunRequest {
  string idempotency_key = 1;
  ficant.core.v1.Ulid run_id = 2;
  ResearchGraph graph = 3;
  ficant.core.v1.LineageRef data_snapshot = 4;
  ficant.core.v1.Sha256 data_snapshot_hash = 5;
  ficant.core.v1.LineageRef universe_snapshot = 6;
  ficant.core.v1.Sha256 universe_snapshot_hash = 7;
  ficant.core.v1.Sha256 parameters_hash = 8;
  uint64 seed = 9;
  repeated RulePackBinding rule_packs = 10;
  repeated ExecutionExternalInput external_inputs = 11;
  ficant.core.v1.FormalInputBinding subject = 12;
}

message SubmitGraphRunResponse {
  ExperimentRun run = 1;
  ExecutionInstanceIdentity execution = 2;
}

message GetGraphRunRequest {
  ficant.core.v1.Ulid run_id = 1;
}

message GraphRun {
  ExperimentRun run = 1;
  ResearchGraph graph = 2;
  ExecutionInstanceIdentity execution = 3;
}

message GetGraphRunResponse {
  GraphRun graph_run = 1;
}

message ListNodeOutputManifestsRequest {
  ficant.core.v1.Ulid run_id = 1;
}

message StoredNodeOutputManifest {
  NodeOutputManifest manifest = 1;
  NodeCheckpoint checkpoint = 2;
}

message ListNodeOutputManifestsResponse {
  repeated StoredNodeOutputManifest manifests = 1;
}

message TraceGraphOutputRequest {
  ficant.core.v1.Ulid run_id = 1;
  ficant.core.v1.Ulid node_id = 2;
}

message GraphOutputTrace {
  GraphRun graph_run = 1;
  repeated StoredNodeOutputManifest manifests = 2;
  repeated ExecutionExternalInput external_inputs = 3;
  repeated ficant.core.v1.FormalOutputEvidence formal_outputs = 4;
}

message TraceGraphOutputResponse {
  GraphOutputTrace trace = 1;
}

// Reads one persisted node's canonical output envelope through the same required
// Artifact/Ceph integrity boundary used by execution. This is a bounded
// observability surface; it does not publish, mutate, or reinterpret results.
message ReadNodeOutputRequest {
  ficant.core.v1.Ulid run_id = 1;
  ficant.core.v1.Ulid node_id = 2;
}

message ObservedNodeOutput {
  string port_name = 1;
  TypedValue value_type = 2;
  ficant.core.v1.Sha256 content_hash = 3;
  bytes payload = 4;
}

message ReadNodeOutputResponse {
  NodeOutputManifest manifest = 1;
  repeated ObservedNodeOutput outputs = 2;
}

enum GraphRunComparisonDimension {
  GRAPH_RUN_COMPARISON_DIMENSION_UNSPECIFIED = 0;
  GRAPH_RUN_COMPARISON_DIMENSION_DATA = 1;
  GRAPH_RUN_COMPARISON_DIMENSION_UNIVERSE = 2;
  GRAPH_RUN_COMPARISON_DIMENSION_GRAPH = 3;
  GRAPH_RUN_COMPARISON_DIMENSION_PARAMETERS = 4;
  GRAPH_RUN_COMPARISON_DIMENSION_RUNTIME = 5;
  GRAPH_RUN_COMPARISON_DIMENSION_ENVIRONMENT = 6;
  GRAPH_RUN_COMPARISON_DIMENSION_SEED = 7;
  GRAPH_RUN_COMPARISON_DIMENSION_RULE_PACK = 8;
  GRAPH_RUN_COMPARISON_DIMENSION_IMPLEMENTATION = 9;
  GRAPH_RUN_COMPARISON_DIMENSION_EXTERNAL_INPUT = 10;
  GRAPH_RUN_COMPARISON_DIMENSION_RESULT = 11;
  GRAPH_RUN_COMPARISON_DIMENSION_SUBJECT = 12;
  GRAPH_RUN_COMPARISON_DIMENSION_CODE = 13;
}

message CompareGraphRunsRequest {
  ficant.core.v1.Ulid left_run_id = 1;
  ficant.core.v1.Ulid right_run_id = 2;
}

message CompareGraphRunsResponse {
  repeated GraphRunComparisonDimension differing_dimensions = 1;
}

service ExperimentService {
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc TransitionRun(TransitionRunRequest) returns (TransitionRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ReadRunJournal(ReadRunJournalRequest) returns (ReadRunJournalResponse);
  rpc SubmitGraphRun(SubmitGraphRunRequest) returns (SubmitGraphRunResponse);
  rpc GetGraphRun(GetGraphRunRequest) returns (GetGraphRunResponse);
  rpc ListNodeOutputManifests(ListNodeOutputManifestsRequest) returns (ListNodeOutputManifestsResponse);
  rpc TraceGraphOutput(TraceGraphOutputRequest) returns (TraceGraphOutputResponse);
  rpc ReadNodeOutput(ReadNodeOutputRequest) returns (ReadNodeOutputResponse);
  rpc CompareGraphRuns(CompareGraphRunsRequest) returns (CompareGraphRunsResponse);
}
