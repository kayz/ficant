syntax = "proto3";

package ficant.research.v1;

import "ficant/core/v1/common.proto";
import "ficant/core/v1/error.proto";
import "ficant/research/v1/signal.proto";

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_GENERIC = 1;
  ARTIFACT_KIND_SIGNAL_SET = 5;
  reserved 2 to 4;
  reserved "ARTIFACT_KIND_CURVE_SNAPSHOT", "ARTIFACT_KIND_DATA_SNAPSHOT", "ARTIFACT_KIND_UNIVERSE_SNAPSHOT";
}

message Artifact {
  ficant.core.v1.Ulid artifact_id = 1;
  ficant.core.v1.OwnerRef owner = 2;
  ArtifactKind kind = 3;
  string media_type = 4;
  ficant.core.v1.Sha256 content_hash = 5;
  uint64 blob_size = 6;
  repeated ficant.core.v1.LineageRef lineage = 7;
}

message GetArtifactRequest {
  ficant.core.v1.Ulid artifact_id = 1;
}

message GetArtifactResponse {
  oneof result {
    Artifact artifact = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message GetSignalSetRequest {
  ficant.core.v1.Ulid signal_set_id = 1;
}

message GetSignalSetResponse {
  oneof result {
    SignalSet signal_set = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message LineagePage {
  repeated ficant.core.v1.LineageRef lineage = 1;
  ficant.core.v1.PageResponse page = 2;
}

message ReadArtifactLineageRequest {
  ficant.core.v1.Ulid artifact_id = 1;
  ficant.core.v1.PageRequest page = 2;
}

message ReadArtifactLineageResponse {
  oneof result {
    LineagePage lineage_page = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message ReadSignalSetLineageRequest {
  ficant.core.v1.Ulid signal_set_id = 1;
  ficant.core.v1.PageRequest page = 2;
}

message ReadSignalSetLineageResponse {
  oneof result {
    LineagePage lineage_page = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

service ArtifactService {
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc GetSignalSet(GetSignalSetRequest) returns (GetSignalSetResponse);
  rpc ReadArtifactLineage(ReadArtifactLineageRequest) returns (ReadArtifactLineageResponse);
  rpc ReadSignalSetLineage(ReadSignalSetLineageRequest) returns (ReadSignalSetLineageResponse);
}
