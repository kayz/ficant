syntax = "proto3";

package ficant.rates.v1;

import "ficant/core/v1/common.proto";
import "ficant/core/v1/error.proto";

message ObjectBinding {
  ficant.core.v1.VersionRef object = 1;
  ficant.core.v1.Sha256 content_hash = 2;
}

message AlgorithmBinding {
  string algorithm_id = 1;
  uint32 algorithm_version = 2;
  string convention_profile = 3;
  uint32 abi_version = 4;
}

message SnapshotBinding {
  ficant.core.v1.Ulid snapshot_id = 1;
  ficant.core.v1.Sha256 content_hash = 2;
}

message ArtifactBinding {
  ficant.core.v1.Ulid artifact_id = 1;
  ficant.core.v1.Sha256 content_hash = 2;
}

message CurveNodeBinding {
  string curve_node_id = 1;
  ficant.core.v1.Sha256 content_hash = 2;
}

enum AnalysisInputRole {
  ANALYSIS_INPUT_ROLE_UNSPECIFIED = 0;
  ANALYSIS_INPUT_ROLE_SUBJECT = 1;
  ANALYSIS_INPUT_ROLE_UNIT = 2;
  ANALYSIS_INPUT_ROLE_BOND = 3;
  ANALYSIS_INPUT_ROLE_CALENDAR = 4;
  ANALYSIS_INPUT_ROLE_CURVE_SNAPSHOT = 5;
  ANALYSIS_INPUT_ROLE_DATA_SNAPSHOT = 6;
  ANALYSIS_INPUT_ROLE_DATA_SOURCE = 7;
  ANALYSIS_INPUT_ROLE_TAX_RULE_PACK = 8;
  ANALYSIS_INPUT_ROLE_FUNDING_RULE_PACK = 9;
  ANALYSIS_INPUT_ROLE_DELIVERY_RULE_PACK = 10;
  ANALYSIS_INPUT_ROLE_FUTURES_CONTRACT = 11;
  ANALYSIS_INPUT_ROLE_TARGET_RISK_ARTIFACT = 12;
  ANALYSIS_INPUT_ROLE_DELIVERY_ARTIFACT = 13;
  ANALYSIS_INPUT_ROLE_CTD_ANALYTICS_ARTIFACT = 14;
  ANALYSIS_INPUT_ROLE_CURVE_RULE_PACK = 15;
  ANALYSIS_INPUT_ROLE_CURVE_NODE_DEFINITION = 16;
}

// AnalysisInputBinding is response evidence built only after the Application
// layer verifies the bound input. observed_at represents valuation/as-of time
// for roles whose authoritative object uses those terms.
message AnalysisInputBinding {
  AnalysisInputRole role = 1;
  ficant.core.v1.OwnerRef owner = 2;
  oneof binding {
    ObjectBinding object = 3;
    SnapshotBinding snapshot = 4;
    ArtifactBinding artifact = 5;
    CurveNodeBinding curve_node = 10;
  }
  ficant.core.v1.MarketTime observed_at = 6;
  ficant.core.v1.MarketTime visible_at = 7;
  ficant.core.v1.MarketTime effective_from = 8;
  ficant.core.v1.MarketTime effective_to = 9;
}

message ParameterDigest {
  AlgorithmBinding algorithm = 1;
  ficant.core.v1.Sha256 canonical_parameters_sha256 = 2;
}

// AnalysisUnits binds every numerical dimension used by the reference
// analytics API to an immutable Unit definition. Inputs must use the matching
// binding and responses echo these identities rather than guessing units.
message AnalysisUnits {
  ficant.core.v1.UnitRef currency_amount = 1;
  ficant.core.v1.UnitRef price_per_100 = 2;
  ficant.core.v1.UnitRef rate = 3;
  ficant.core.v1.UnitRef years = 4;
  ficant.core.v1.UnitRef years_squared = 5;
  ficant.core.v1.UnitRef dv01_per_100 = 6;
  ficant.core.v1.UnitRef dv01 = 7;
  ficant.core.v1.UnitRef dimensionless = 8;
  ficant.core.v1.UnitRef contract_count = 9;
}

message AnalysisContext {
  ficant.core.v1.OwnerRef owner = 1;
  reserved 2, 3, 7, 8;
  reserved "rule_pack", "data_snapshot", "funding_rule_pack", "tax_rule_pack";
  AlgorithmBinding algorithm = 4;
  AnalysisUnits units = 5;
  ficant.core.v1.VersionRef subject_ref = 6;
  ficant.core.v1.MarketTime knowledge_at = 9;
}

message ResultMetadata {
  string schema_id = 1;
  string engine_id = 2;
  string engine_version = 3;
  AlgorithmBinding algorithm = 4;
  ficant.core.v1.VersionRef subject_ref = 5;
  reserved 6, 7;
  reserved "funding_rule_pack", "tax_rule_pack";
  repeated AnalysisInputBinding consumed_inputs = 8;
  ParameterDigest parameter_digest = 9;
  ficant.core.v1.Sha256 request_fingerprint = 10;
}

enum CalendarRequirement {
  CALENDAR_REQUIREMENT_UNSPECIFIED = 0;
  CALENDAR_REQUIREMENT_REFERENCE_REPLAY = 1;
  CALENDAR_REQUIREMENT_EXACT_MARKET = 2;
}

message DerivedCashflow {
  uint32 sequence = 1;
  string nominal_date = 2;
  string payment_date = 3;
  ficant.core.v1.DecimalValue coupon = 4;
  ficant.core.v1.DecimalValue principal = 5;
  ficant.core.v1.DecimalValue total = 6;
}

message BondAnalyticsMeasures {
  ficant.core.v1.DecimalValue accrued_interest = 1;
  ficant.core.v1.DecimalValue clean_price = 2;
  ficant.core.v1.DecimalValue dirty_price = 3;
  ficant.core.v1.DecimalValue yield_to_maturity = 4;
  ficant.core.v1.DecimalValue macaulay_duration = 5;
  ficant.core.v1.DecimalValue modified_duration = 6;
  ficant.core.v1.DecimalValue convexity = 7;
  ficant.core.v1.DecimalValue dv01 = 8;
}

message TaxAdjustedBondAnalytics {
  repeated DerivedCashflow cashflows = 1;
  ficant.core.v1.DecimalValue yield_to_maturity = 2;
}

message AnalyzeBondRequest {
  AnalysisContext context = 1;
  ObjectBinding bond = 2;
  ficant.core.v1.MarketTime valuation_at = 3;
  string settlement_date = 4;
  CalendarRequirement calendar_requirement = 5;
  ObjectBinding calendar = 6;
  reserved 7, 10;
  reserved "terms";
  oneof input {
    ficant.core.v1.DecimalValue yield_to_maturity = 8;
    ficant.core.v1.DecimalValue clean_price = 9;
  }
  SnapshotBinding data_snapshot = 11;
  ObjectBinding tax_rule_pack = 12;
}

message AnalyzeBondResult {
  repeated DerivedCashflow cashflows = 1;
  BondAnalyticsMeasures measures = 2;
  ResultMetadata metadata = 3;
  TaxAdjustedBondAnalytics after_tax = 4;
}

// RiskSummary is the deterministic risk-only projection consumed by
// downstream ResearchGraph nodes. Values retain the exact Unit bindings and
// source metadata from AnalyzeBondResult; the node must not recompute them.
message RiskSummary {
  ficant.core.v1.DecimalValue modified_duration = 1;
  ficant.core.v1.DecimalValue convexity = 2;
  ficant.core.v1.DecimalValue dv01 = 3;
  ResultMetadata source_metadata = 4;
}

message AnalyzeBondResponse {
  oneof result {
    AnalyzeBondResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message InterpolateYieldCurveRequest {
  AnalysisContext context = 1;
  SnapshotBinding curve = 2;
  string query_date = 3;
}

message InterpolateYieldCurveResult {
  string query_date = 1;
  ficant.core.v1.DecimalValue yield_to_maturity = 2;
  ResultMetadata metadata = 3;
}

message InterpolateYieldCurveResponse {
  oneof result {
    InterpolateYieldCurveResult point = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message AnalyzeCarryRollRequest {
  AnalysisContext context = 1;
  ObjectBinding bond = 2;
  ficant.core.v1.MarketTime valuation_at = 3;
  string initial_settlement = 4;
  string horizon_settlement = 5;
  CalendarRequirement calendar_requirement = 6;
  reserved 7, 8;
  reserved "calendar", "terms";
  SnapshotBinding curve = 9;
}

message CarryRollMeasures {
  ficant.core.v1.DecimalValue initial_yield = 1;
  ficant.core.v1.DecimalValue rolled_yield = 2;
  ficant.core.v1.DecimalValue initial_dirty_price = 3;
  ficant.core.v1.DecimalValue horizon_dirty_at_initial_yield = 4;
  ficant.core.v1.DecimalValue horizon_dirty_at_rolled_yield = 5;
  ficant.core.v1.DecimalValue paid_cashflows = 6;
  ficant.core.v1.DecimalValue carry = 7;
  ficant.core.v1.DecimalValue roll_down = 8;
  ficant.core.v1.DecimalValue total_return = 9;
}

message AnalyzeCarryRollResult {
  CarryRollMeasures measures = 1;
  ResultMetadata metadata = 2;
}

message AnalyzeCarryRollResponse {
  oneof result {
    AnalyzeCarryRollResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message AnalyzeFuturesDeliveryRequest {
  AnalysisContext context = 1;
  ObjectBinding futures_contract = 2;
  ficant.core.v1.MarketTime valuation_at = 3;
  string purchase_date = 4;
  reserved 5 to 10;
  reserved "delivery_month_first", "delivery_date", "product", "futures_clean_price", "candidates";
  SnapshotBinding data_snapshot = 11;
  ObjectBinding funding_rule_pack = 12;
}

message FuturesDeliveryMeasures {
  uint32 months_to_next_coupon = 1;
  uint32 remaining_coupon_count = 2;
  ficant.core.v1.DecimalValue conversion_factor = 3;
  ficant.core.v1.DecimalValue purchase_accrued_interest = 4;
  ficant.core.v1.DecimalValue delivery_accrued_interest = 5;
  ficant.core.v1.DecimalValue interim_coupons = 6;
  ficant.core.v1.DecimalValue invoice_price = 7;
  ficant.core.v1.DecimalValue purchase_dirty_price = 8;
  ficant.core.v1.DecimalValue gross_basis = 9;
  ficant.core.v1.DecimalValue financing_cost = 10;
  ficant.core.v1.DecimalValue holding_carry = 11;
  ficant.core.v1.DecimalValue net_basis = 12;
  ficant.core.v1.DecimalValue implied_repo_rate = 13;
  ficant.core.v1.DecimalValue delivery_profit = 14;
  ficant.core.v1.DecimalValue funding_adjusted_irr = 15;
}

message FuturesDeliveryCandidateResult {
  ObjectBinding bond = 1;
  FuturesDeliveryMeasures measures = 2;
}

message AnalyzeFuturesDeliveryResult {
  repeated FuturesDeliveryCandidateResult candidates = 1;
  uint32 ctd_index = 2;
  ResultMetadata metadata = 3;
}

message AnalyzeFuturesDeliveryResponse {
  oneof result {
    AnalyzeFuturesDeliveryResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message AnalyzeFuturesHedgeRequest {
  AnalysisContext context = 1;
  ArtifactBinding target_risk_artifact = 2;
  ArtifactBinding delivery_artifact = 3;
  ArtifactBinding ctd_analytics_artifact = 4;
  ObjectBinding futures_contract = 5;
  reserved 6, 8 to 11;
  reserved "ctd_bond", "product", "target_dv01", "ctd_dv01_per_100", "conversion_factor";
  ficant.core.v1.MarketTime valuation_at = 7;
}

message FuturesHedgeMeasures {
  ficant.core.v1.DecimalValue futures_contract_dv01 = 1;
  ficant.core.v1.DecimalValue raw_contracts = 2;
  int64 recommended_contracts = 3;
  ficant.core.v1.DecimalValue residual_dv01 = 4;
  ficant.core.v1.DecimalValue hedge_effectiveness = 5;
}

message AnalyzeFuturesHedgeResult {
  FuturesHedgeMeasures measures = 1;
  ResultMetadata metadata = 2;
}

message AnalyzeFuturesHedgeResponse {
  oneof result {
    AnalyzeFuturesHedgeResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

service RatesAnalyticsService {
  rpc AnalyzeBond(AnalyzeBondRequest) returns (AnalyzeBondResponse);
  rpc InterpolateYieldCurve(InterpolateYieldCurveRequest) returns (InterpolateYieldCurveResponse);
  rpc AnalyzeCarryRoll(AnalyzeCarryRollRequest) returns (AnalyzeCarryRollResponse);
  rpc AnalyzeFuturesDelivery(AnalyzeFuturesDeliveryRequest) returns (AnalyzeFuturesDeliveryResponse);
  rpc AnalyzeFuturesHedge(AnalyzeFuturesHedgeRequest) returns (AnalyzeFuturesHedgeResponse);
}
