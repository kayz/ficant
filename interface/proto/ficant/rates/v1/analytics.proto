syntax = "proto3";

package ficant.rates.v1;

import "ficant/core/v1/common.proto";
import "ficant/core/v1/error.proto";
import "ficant/core/v1/subject.proto";
import "ficant/market/v1/definition.proto";
import "ficant/market/v1/rule.proto";
import "ficant/market/v1/tax_rule.proto";

message AnalysisUnits {
  ficant.core.v1.UnitRef currency_amount = 1;
  ficant.core.v1.UnitRef price_per_100 = 2;
  ficant.core.v1.UnitRef rate = 3;
  ficant.core.v1.UnitRef years = 4;
  ficant.core.v1.UnitRef years_squared = 5;
  ficant.core.v1.UnitRef dv01_per_100 = 6;
  ficant.core.v1.UnitRef dv01 = 7;
  ficant.core.v1.UnitRef dimensionless = 8;
  ficant.core.v1.UnitRef contract_count = 9;
}

enum CalendarRequirement {
  CALENDAR_REQUIREMENT_UNSPECIFIED = 0;
  CALENDAR_REQUIREMENT_REFERENCE_REPLAY = 1;
  CALENDAR_REQUIREMENT_EXACT_MARKET = 2;
}

// BondTaxBasis identifies the explicit execution mode and tax basis for
// AnalyzeBond requests and results.
enum BondTaxBasis {
  // Legacy/inferred on requests (PRE_TAX when tax_context is absent,
  // TAX_ADJUSTED when tax_context is present). Not valid as a resolved basis
  // in compliant responses.
  BOND_TAX_BASIS_UNSPECIFIED = 0;
  // Pre-tax bond analytics. On requests, tax_context must be absent.
  BOND_TAX_BASIS_PRE_TAX = 1;
  // Tax-adjusted bond analytics. On requests, requires a valid tax_context,
  // bond tax_attributes, and matching tax treatment.
  BOND_TAX_BASIS_TAX_ADJUSTED = 2;
}

message DerivedCashflow {
  uint32 sequence = 1;
  string nominal_date = 2;
  string payment_date = 3;
  ficant.core.v1.DecimalValue coupon = 4;
  ficant.core.v1.DecimalValue principal = 5;
  ficant.core.v1.DecimalValue total = 6;
}

message BondAnalyticsMeasures {
  ficant.core.v1.DecimalValue accrued_interest = 1;
  ficant.core.v1.DecimalValue clean_price = 2;
  ficant.core.v1.DecimalValue dirty_price = 3;
  ficant.core.v1.DecimalValue yield_to_maturity = 4;
  ficant.core.v1.DecimalValue macaulay_duration = 5;
  ficant.core.v1.DecimalValue modified_duration = 6;
  ficant.core.v1.DecimalValue convexity = 7;
  ficant.core.v1.DecimalValue dv01 = 8;
}

message TaxAdjustedBondAnalytics {
  repeated DerivedCashflow cashflows = 1;
  ficant.core.v1.DecimalValue yield_to_maturity = 2;
  ficant.market.v1.CouponTaxClaimScope claim_scope = 3;
  // Tax basis of this sub-result; always BOND_TAX_BASIS_TAX_ADJUSTED on
  // compliant responses.
  BondTaxBasis tax_basis = 4;
}

message BondTaxContext {
  ficant.core.v1.TaxTreatment subject_tax_treatment = 1;
  ficant.market.v1.MarketRulePack tax_rule_pack = 2;
}

message AnalyzeBondRequest {
  AnalysisUnits units = 1;
  ficant.market.v1.Bond bond = 2;
  string settlement_date = 3;
  CalendarRequirement calendar_requirement = 4;
  ficant.market.v1.Calendar calendar = 5;
  oneof input {
    ficant.core.v1.DecimalValue yield_to_maturity = 6;
    ficant.core.v1.DecimalValue clean_price = 7;
  }
  BondTaxContext tax_context = 8;
  // Explicit execution mode.
  // - BOND_TAX_BASIS_PRE_TAX: rejects any tax_context.
  // - BOND_TAX_BASIS_TAX_ADJUSTED: requires a valid tax_context, bond
  //   tax_attributes, and matching tax treatment.
  // - BOND_TAX_BASIS_UNSPECIFIED: legacy-compatible inference from tax_context
  //   presence.
  // - Unknown non-zero values are rejected with ValidationFailed.
  // Upgrade contract: new clients sending any non-zero execution_mode against
  // an older server that ignores field 9 must reject responses lacking matching
  // execution_mode, measures_tax_basis = PRE_TAX, or required after_tax
  // presence and tax_basis.
  BondTaxBasis execution_mode = 9;
}

message AnalyzeBondResult {
  // Top-level cashflows and measures are always pre-tax
  // (measures_tax_basis = BOND_TAX_BASIS_PRE_TAX).
  repeated DerivedCashflow cashflows = 1;
  BondAnalyticsMeasures measures = 2;
  // Present only when resolved execution_mode is BOND_TAX_BASIS_TAX_ADJUSTED;
  // carries tax_basis = BOND_TAX_BASIS_TAX_ADJUSTED.
  TaxAdjustedBondAnalytics after_tax = 3;
  // Resolved execution mode echoed by the server (PRE_TAX or TAX_ADJUSTED).
  BondTaxBasis execution_mode = 4;
  // Tax basis of top-level cashflows and measures; always
  // BOND_TAX_BASIS_PRE_TAX on compliant responses.
  BondTaxBasis measures_tax_basis = 5;
}

message AnalyzeBondResponse {
  oneof result {
    AnalyzeBondResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message YieldCurveNodeInput {
  string maturity_date = 1;
  ficant.core.v1.DecimalValue yield_to_maturity = 2;
}

message InterpolateYieldCurveRequest {
  AnalysisUnits units = 1;
  string as_of_date = 2;
  repeated YieldCurveNodeInput nodes = 3;
  string query_date = 4;
}

message InterpolateYieldCurveResult {
  string query_date = 1;
  ficant.core.v1.DecimalValue yield_to_maturity = 2;
}

message InterpolateYieldCurveResponse {
  oneof result {
    InterpolateYieldCurveResult point = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message AnalyzeCarryRollRequest {
  AnalysisUnits units = 1;
  ficant.market.v1.Bond bond = 2;
  string initial_settlement = 3;
  string horizon_settlement = 4;
  CalendarRequirement calendar_requirement = 5;
  ficant.market.v1.Calendar calendar = 6;
  string curve_as_of_date = 7;
  repeated YieldCurveNodeInput curve_nodes = 8;
}

message CarryRollMeasures {
  ficant.core.v1.DecimalValue initial_yield = 1;
  ficant.core.v1.DecimalValue rolled_yield = 2;
  ficant.core.v1.DecimalValue initial_dirty_price = 3;
  ficant.core.v1.DecimalValue horizon_dirty_at_initial_yield = 4;
  ficant.core.v1.DecimalValue horizon_dirty_at_rolled_yield = 5;
  ficant.core.v1.DecimalValue paid_cashflows = 6;
  ficant.core.v1.DecimalValue carry = 7;
  ficant.core.v1.DecimalValue roll_down = 8;
  ficant.core.v1.DecimalValue total_return = 9;
}

message AnalyzeCarryRollResult {
  CarryRollMeasures measures = 1;
}

message AnalyzeCarryRollResponse {
  oneof result {
    AnalyzeCarryRollResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message FuturesCandidateInput {
  ficant.market.v1.Bond bond = 1;
  ficant.core.v1.DecimalValue spot_clean_price = 2;
}

message SubjectFundingContext {
  ficant.core.v1.FundingTier funding_tier = 1;
  ficant.market.v1.MarketRulePack funding_rule_pack = 2;
}

message AnalyzeFuturesDeliveryRequest {
  AnalysisUnits units = 1;
  string product_code = 2;
  string delivery_month_first = 3;
  string purchase_date = 4;
  string delivery_date = 5;
  ficant.core.v1.DecimalValue futures_clean_price = 6;
  ficant.market.v1.MarketRulePack delivery_rule_pack = 7;
  repeated FuturesCandidateInput candidates = 8;
  oneof financing {
    ficant.core.v1.DecimalValue annual_financing_rate = 9;
    SubjectFundingContext subject_funding = 10;
  }
  BondTaxContext tax_context = 11;
}

message FuturesDeliveryMeasures {
  uint32 months_to_next_coupon = 1;
  uint32 remaining_coupon_count = 2;
  ficant.core.v1.DecimalValue conversion_factor = 3;
  ficant.core.v1.DecimalValue purchase_accrued_interest = 4;
  ficant.core.v1.DecimalValue delivery_accrued_interest = 5;
  ficant.core.v1.DecimalValue interim_coupons = 6;
  ficant.core.v1.DecimalValue invoice_price = 7;
  ficant.core.v1.DecimalValue purchase_dirty_price = 8;
  ficant.core.v1.DecimalValue gross_basis = 9;
  ficant.core.v1.DecimalValue financing_cost = 10;
  ficant.core.v1.DecimalValue holding_carry = 11;
  ficant.core.v1.DecimalValue net_basis = 12;
  ficant.core.v1.DecimalValue implied_repo_rate = 13;
  ficant.core.v1.DecimalValue delivery_profit = 14;
  ficant.core.v1.DecimalValue funding_adjusted_irr = 15;
  ficant.core.v1.DecimalValue tax_adjusted_interim_coupons = 16;
  ficant.core.v1.DecimalValue subject_tax_adjusted_irr = 17;
}

message FuturesDeliveryCandidateResult {
  ficant.core.v1.VersionRef bond = 1;
  FuturesDeliveryMeasures measures = 2;
  ficant.market.v1.CouponTaxClaimScope claim_scope = 3;
}

message AnalyzeFuturesDeliveryResult {
  repeated FuturesDeliveryCandidateResult candidates = 1;
  uint32 ctd_index = 2;
  optional uint32 subject_ctd_index = 3;
}

message AnalyzeFuturesDeliveryResponse {
  oneof result {
    AnalyzeFuturesDeliveryResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message AnalyzeFuturesHedgeRequest {
  AnalysisUnits units = 1;
  string product_code = 2;
  ficant.core.v1.DecimalValue target_dv01 = 3;
  ficant.core.v1.DecimalValue ctd_dv01_per_100 = 4;
  ficant.core.v1.DecimalValue conversion_factor = 5;
  // Required verified delivery rule pack (with 32-byte SHA-256 content_hash)
  // supplying contract notional and face quote basis.
  // Upgrade constraint: legacy clients omitting delivery_rule_pack against new
  // servers receive ValidationFailed; callers must upgrade or explicitly supply
  // this field.
  ficant.market.v1.MarketRulePack delivery_rule_pack = 6;
  // Optional valuation timestamp with proto3 message presence.
  // When present, validated for timezone and half-open rule-pack validity
  // window [effective_from, effective_to). When absent, performs explicit-pack
  // pro-forma evaluation while still verifying rule-pack validity range.
  ficant.core.v1.MarketTime valuation_at = 7;
}

message FuturesHedgeMeasures {
  ficant.core.v1.DecimalValue futures_contract_dv01 = 1;
  ficant.core.v1.DecimalValue raw_contracts = 2;
  int64 recommended_contracts = 3;
  ficant.core.v1.DecimalValue residual_dv01 = 4;
  ficant.core.v1.DecimalValue hedge_effectiveness = 5;
  // Resolved futures contract notional derived from delivery_rule_pack,
  // expressed using the request's units.currency_amount.
  // Upgrade contract: new clients require presence, valid positive finite
  // decimal value, and unit matching request.units.currency_amount.
  ficant.core.v1.DecimalValue contract_notional = 6;
}

message AnalyzeFuturesHedgeResult {
  FuturesHedgeMeasures measures = 1;
}

message AnalyzeFuturesHedgeResponse {
  oneof result {
    AnalyzeFuturesHedgeResult analysis = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

service RatesAnalyticsService {
  rpc AnalyzeBond(AnalyzeBondRequest) returns (AnalyzeBondResponse);
  rpc InterpolateYieldCurve(InterpolateYieldCurveRequest) returns (InterpolateYieldCurveResponse);
  rpc AnalyzeCarryRoll(AnalyzeCarryRollRequest) returns (AnalyzeCarryRollResponse);
  rpc AnalyzeFuturesDelivery(AnalyzeFuturesDeliveryRequest) returns (AnalyzeFuturesDeliveryResponse);
  rpc AnalyzeFuturesHedge(AnalyzeFuturesHedgeRequest) returns (AnalyzeFuturesHedgeResponse);
}
