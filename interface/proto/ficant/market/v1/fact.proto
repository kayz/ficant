syntax = "proto3";

package ficant.market.v1;

import "ficant/core/v1/common.proto";
import "ficant/core/v1/error.proto";
import "ficant/core/v1/governance.proto";

message FactSource {
  string source_id = 1;
  string external_id = 2;
  uint64 source_revision = 3;
  ficant.core.v1.VersionRef data_source = 4;
}

enum CashflowType {
  CASHFLOW_TYPE_UNSPECIFIED = 0;
  CASHFLOW_TYPE_COUPON = 1;
  CASHFLOW_TYPE_PRINCIPAL = 2;
  CASHFLOW_TYPE_FEE = 3;
  CASHFLOW_TYPE_OTHER = 4;
}

// Cashflow records an external source fact. It never generates a schedule.
message Cashflow {
  ficant.core.v1.Ulid cashflow_id = 1;
  ficant.core.v1.VersionRef bond = 2;
  ficant.core.v1.MarketTime payment_time = 3;
  ficant.core.v1.DecimalValue amount = 4;
  ficant.core.v1.OwnerRef owner = 5;
  FactSource source = 6;
  ficant.core.v1.Ulid supersedes_id = 7;
  string schedule_id = 8;
  uint64 sequence = 9;
  CashflowType cashflow_type = 10;
}

message Quote {
  ficant.core.v1.Ulid quote_id = 1;
  ficant.core.v1.VersionRef instrument = 2;
  ficant.core.v1.OwnerRef owner = 3;
  FactSource source = 4;
  ficant.core.v1.MarketTime observed_at = 5;
  ficant.core.v1.MarketTime received_at = 6;
  ficant.core.v1.DecimalValue bid = 7;
  ficant.core.v1.DecimalValue ask = 8;
  ficant.core.v1.Ulid supersedes_id = 9;
}

message Trade {
  ficant.core.v1.Ulid trade_id = 1;
  ficant.core.v1.VersionRef instrument = 2;
  ficant.core.v1.OwnerRef owner = 3;
  FactSource source = 4;
  ficant.core.v1.MarketTime executed_at = 5;
  ficant.core.v1.DecimalValue price = 6;
  ficant.core.v1.DecimalValue quantity = 7;
  ficant.core.v1.Ulid supersedes_id = 8;
}

// ValuationValueRole binds each externally supplied value to its financial
// measure. Legacy valuations omit value_roles and canonically mean PRICE for
// every value.
enum ValuationValueRole {
  VALUATION_VALUE_ROLE_UNSPECIFIED = 0;
  VALUATION_VALUE_ROLE_PRICE = 1;
  VALUATION_VALUE_ROLE_YIELD = 2;
  VALUATION_VALUE_ROLE_REMAINING_YEARS = 3;
}

// Valuation records externally supplied values and their provenance only.
message Valuation {
  ficant.core.v1.Ulid valuation_id = 1;
  ficant.core.v1.VersionRef instrument = 2;
  ficant.core.v1.OwnerRef owner = 3;
  FactSource source = 4;
  ficant.core.v1.MarketTime valuation_at = 5;
  string method = 6;
  ficant.core.v1.VersionRef rule_pack = 7;
  repeated ficant.core.v1.DecimalValue values = 8;
  ficant.core.v1.Ulid supersedes_id = 9;
  repeated ValuationValueRole value_roles = 10;
}

// CurveSnapshot records an immutable external fixture and never builds a curve.
message CurveSnapshot {
  ficant.core.v1.Ulid curve_snapshot_id = 1;
  ficant.core.v1.OwnerRef owner = 2;
  ficant.core.v1.MarketTime as_of = 3;
  ficant.core.v1.UnitRef currency = 4;
  string curve_kind = 5;
  ficant.core.v1.VersionRef calendar = 6;
  ficant.core.v1.VersionRef rule_pack = 7;
  string point_schema = 8;
  ficant.core.v1.Sha256 content_hash = 9;
  repeated ficant.core.v1.LineageRef lineage = 10;
  ficant.core.v1.MarketTime visible_at = 11;
  string curve_family_id = 12;
}

message CurveSnapshotInput {
  ficant.core.v1.Ulid curve_snapshot_id = 1;
  ficant.core.v1.OwnerRef owner = 2;
  ficant.core.v1.MarketTime as_of = 3;
  ficant.core.v1.UnitRef currency = 4;
  string curve_kind = 5;
  ficant.core.v1.VersionRef calendar = 6;
  ficant.core.v1.VersionRef rule_pack = 7;
  string point_schema = 8;
  repeated ficant.core.v1.LineageRef lineage = 9;
  ficant.core.v1.MarketTime visible_at = 10;
  string curve_family_id = 11;
}

// CurvePointSet is the canonical payload for point_schema
// ficant.yield-curve-points.protobuf.v1.
message CurvePoint {
  string curve_node_id = 1;
  ficant.core.v1.Sha256 curve_node_content_hash = 2;
  ficant.core.v1.DecimalValue yield_to_maturity = 3;
}

message CurvePointSet {
  string curve_family_id = 1;
  repeated CurvePoint points = 2;
}

message MarketFact {
  oneof fact {
    Cashflow cashflow = 1;
    Quote quote = 2;
    Trade trade = 3;
    Valuation valuation = 4;
  }
}

message AppendMarketFactRequest {
  string idempotency_key = 1;
  MarketFact fact = 2;
  ficant.core.v1.ChangeJustification change = 3;
}

message AppendMarketFactResponse {
  oneof result {
    MarketFact fact = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message CorrectMarketFactRequest {
  string idempotency_key = 1;
  ficant.core.v1.Ulid original_fact_id = 2;
  MarketFact fact = 3;
  ficant.core.v1.ChangeJustification change = 4;
}

message CorrectMarketFactResponse {
  oneof result {
    MarketFact fact = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message PublishCurveSnapshotRequest {
  string idempotency_key = 1;
  reserved 2;
  reserved "curve_snapshot";
  CurvePointSet points = 3;
  ficant.core.v1.ChangeJustification change = 4;
  CurveSnapshotInput curve = 5;
}

message PublishCurveSnapshotResponse {
  oneof result {
    CurveSnapshot curve_snapshot = 1;
    ficant.core.v1.ErrorDetail error = 2;
  }
}

message QueryInstrumentFactsRequest {
  ficant.core.v1.VersionRef instrument = 1;
  ficant.core.v1.MarketTime from = 2;
  ficant.core.v1.MarketTime to = 3;
  ficant.core.v1.PageRequest page = 4;
  ficant.core.v1.MarketTime knowledge_at = 5;
}

message InstrumentFacts {
  repeated MarketFact facts = 1;
  ficant.core.v1.PageResponse page = 2;
}

message QueryInstrumentFactsResponse {
  reserved 1, 2;
  reserved "facts", "page";
  oneof result {
    InstrumentFacts instrument_facts = 3;
    ficant.core.v1.ErrorDetail error = 4;
  }
}

message GetCurveSnapshotRequest {
  ficant.core.v1.Ulid curve_snapshot_id = 1;
  ficant.core.v1.MarketTime knowledge_at = 2;
}

message CurveSnapshotPayload {
  CurveSnapshot curve_snapshot = 1;
  CurvePointSet points = 2;
}

message GetCurveSnapshotResponse {
  reserved 1;
  reserved "curve_snapshot";
  oneof result {
    CurveSnapshotPayload curve = 2;
    ficant.core.v1.ErrorDetail error = 3;
  }
}

service MarketFactService {
  rpc AppendMarketFact(AppendMarketFactRequest) returns (AppendMarketFactResponse);
  rpc CorrectMarketFact(CorrectMarketFactRequest) returns (CorrectMarketFactResponse);
  rpc PublishCurveSnapshot(PublishCurveSnapshotRequest) returns (PublishCurveSnapshotResponse);
  rpc QueryInstrumentFacts(QueryInstrumentFactsRequest) returns (QueryInstrumentFactsResponse);
  rpc GetCurveSnapshot(GetCurveSnapshotRequest) returns (GetCurveSnapshotResponse);
}
