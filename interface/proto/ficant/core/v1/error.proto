syntax = "proto3";

package ficant.core.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VALIDATION_FAILED = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_VERSION_CONFLICT = 4;
  ERROR_CODE_CONCURRENCY_CONFLICT = 5;
  ERROR_CODE_IMMUTABLE_VIOLATION = 6;
  ERROR_CODE_LINEAGE_INCOMPLETE = 7;
  ERROR_CODE_HASH_MISMATCH = 8;
  ERROR_CODE_UNAUTHENTICATED = 9;
  ERROR_CODE_FORBIDDEN = 10;
  ERROR_CODE_STORAGE_UNAVAILABLE = 11;
  ERROR_CODE_INTERNAL = 12;
}

message FieldViolation {
  string field = 1;
  string description = 2;
}

// ErrorDetail is attached to a gRPC status. message is safe for clients and
// must not expose SQL, bucket names, credentials, stack traces, or raw causes.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string trace_id = 3;
  bool retryable = 4;
  string resource_ref = 5;
  repeated FieldViolation field_violations = 6;
}
