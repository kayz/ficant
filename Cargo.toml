[workspace]
resolver = "3"
members = ["binaries/*", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/kayz/ficant"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "=0.1.89"
arrow = { version = "=59.1.0", default-features = false, features = ["ipc"] }
bytes = "=1.12.1"
cc = "=1.2.67"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
proptest = "=1.9.0"
prost = "=0.14.4"
prost-types = "=0.14.4"
ring = "=0.17.14"
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "rust_decimal"] }
thiserror = "=2.0.17"
tokio = { version = "=1.49.0", default-features = false, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "server", "channel"] }
tonic-prost = "=0.14.6"
tonic-web = "=0.14.6"
tower-layer = "=0.3.3"
ulid = { version = "=1.2.1", default-features = false }
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }
parquet = { version = "=59.1.0", default-features = false, features = ["arrow"] }
serde = { version = "=1.0.228", features = ["derive"] }
